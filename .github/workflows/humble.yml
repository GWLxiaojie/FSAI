name: humble
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap, build and test
        run: bash tools/ci_humble.sh
      - name: Upload ten-lap metrics (no official meshes or geometry)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-ten-lap-metrics
          path: artifacts/official-ci.json
          if-no-files-found: warn
