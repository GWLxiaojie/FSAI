name: jazzy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: jazzy
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Install core dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libeigen3-dev ros-jazzy-ament-cmake-gtest
      - name: Compile compatible libraries
        run: bash tools/ci_jazzy.sh
